    function tocarCampainhaNotificacao() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.18, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.35);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880, now + 0.14);
        gain2.gain.setValueAtTime(0.22, now + 0.14);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.14);
        osc2.stop(now + 0.6);
      } catch (e) {}
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    async function registrarPushNoServidor(usuarioAtual) {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        if (Notification.permission !== 'granted') return;
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });
        }
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            acao: 'registrar_push',
            usuario: usuarioAtual || 'Equipe',
            subscription: sub.toJSON()
          })
        });
      } catch (e) {
        console.error('Erro push:', e);
      }
    }

    const callAPI = async (acao, payload = {}) => {
      try {
        let resp;
        if (acao === 'obterDadosIniciais') {
          resp = await fetch(`${API_URL}?acao=obterDadosIniciais&t=${Date.now()}`, {
            method: 'GET',
            redirect: 'follow'
          });
        } else {
          resp = await fetch(API_URL, {
            method: 'POST',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ acao, ...payload })
          });
        }
        const text = await resp.text();
        try {
          return JSON.parse(text);
        } catch (parseErr) {
          return {
            sucesso: false,
            erro: 'A implantação do Apps Script ainda está devolvendo a página antiga (HTML) em vez de JSON. Publique uma Nova versão do Código.gs.'
          };
        }
      } catch (err) {
        console.error("Erro API:", err);
        return { sucesso: false, erro: err.message || "Erro de conexão com o Google Sheets." };
      }
    };

    const formatCurrency = (val) => Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const getTodayISO = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    function formatTime(val) {
      if (!val) return '09:00';
      const str = String(val).trim();
      if (str.includes('1899') || str.includes('GMT') || str.includes('(')) {
        const d = new Date(val);
        if (!isNaN(d.getTime())) return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      if (str.includes(':')) {
        const parts = str.split(':');
        return `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`.slice(0, 5);
      }
      return str.slice(0, 5);
    }

    const timeToMinutes = (tStr) => {
      if (!tStr) return 0;
      const [h, m] = formatTime(tStr).split(':').map(Number);
      return h * 60 + m;
    };

    const parseMinutes = (timeStr) => {
      const num = parseInt(timeStr, 10);
      return isNaN(num) ? 60 : num;
    };

    const addMinutesToTime = (timeStr, minutes) => {
      const [h, m] = formatTime(timeStr).split(':').map(Number);
      const total = h * 60 + m + minutes;
      return `${String(Math.floor(total / 60) % 24).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    };

    function getWeekDays(referenceDateStr) {
      const [y, m, d] = (referenceDateStr || getTodayISO()).split('-').map(Number);
      const curr = new Date(y, m - 1, d);
      const distanceToMonday = (curr.getDay() + 6) % 7;
      const monday = new Date(curr);
      monday.setDate(curr.getDate() - distanceToMonday);

      const weekNames = ['SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB', 'DOM'];
      const days = [];
      for (let i = 0; i < 7; i++) {
        const temp = new Date(monday);
        temp.setDate(monday.getDate() + i);
        const iso = `${temp.getFullYear()}-${String(temp.getMonth() + 1).padStart(2, '0')}-${String(temp.getDate()).padStart(2, '0')}`;
        days.push({ week: weekNames[i], date: String(temp.getDate()).padStart(2, '0'), fullDate: iso, active: iso === referenceDateStr });
      }
      return days;
    }

    function OtherPage({ 
      tab, isAdmin, currentUser, users, allUsers, services, appointments, clientsList,
      onSaveClient, onEditClient, onDeleteClient,
      wppTemplate, onSaveWppTemplateDirect, formatWhatsappMessage,
      onOpenUserModal, onEditUser, onOpenServiceModal, onEditService, onSelectAppointment 
    }) {
      const [clientSubTab, setClientSubTab] = useState('agendadas');
      const [selectedClientPro, setSelectedClientPro] = useState('Todos');
      const [selectedHistPro, setSelectedHistPro] = useState('Todos');
      const [periodFilter, setPeriodFilter] = useState('mes');
      const [customStart, setCustomStart] = useState(getTodayISO());
      const [customEnd, setCustomEnd] = useState(getTodayISO());
      const [selectedPro, setSelectedPro] = useState(isAdmin ? 'Todos' : currentUser);
      const [discountPercent, setDiscountPercent] = useState(0);

      const [newClientPhone, setNewClientPhone] = useState('');
      const [clientSearchFilter, setClientSearchFilter] = useState('');
      const [savingClient, setSavingClient] = useState(false);

      const [editingClientObj, setEditingClientObj] = useState(null);
      const [editClientName, setEditClientName] = useState('');
      const [editClientPhone, setEditClientPhone] = useState('');
      const [savingEditClient, setSavingEditClient] = useState(false);

      const [localWppText, setLocalWppText] = useState(wppTemplate);

      useEffect(() => { setLocalWppText(wppTemplate); }, [wppTemplate]);
      useEffect(() => { if (!isAdmin) setSelectedPro(currentUser); }, [isAdmin, currentUser]);
      const effectivePro = isAdmin ? selectedPro : currentUser;

      const todayStr = getTodayISO();
      const todayAppointmentsList = useMemo(() => {
        return appointments
          .filter(a => a.date === todayStr)
          .sort((a, b) => a.time.localeCompare(b.time));
      }, [appointments, todayStr]);

      const todayRevenueAppointments = useMemo(() => {
        return todayAppointmentsList.filter(a => isAdmin || a.pro === currentUser);
      }, [todayAppointmentsList, isAdmin, currentUser]);

      const futureAppointments = useMemo(() => {
        return appointments
          .filter(a => a.date >= todayStr && (selectedClientPro === 'Todos' || a.pro === selectedClientPro))
          .sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
      }, [appointments, selectedClientPro, todayStr]);

      const pastAppointments = useMemo(() => {
        return appointments
          .filter(a => a.date < todayStr && (selectedHistPro === 'Todos' || a.pro === selectedHistPro))
          .sort((a, b) => b.date.localeCompare(a.date) || b.time.localeCompare(a.time));
      }, [appointments, selectedHistPro, todayStr]);

      const filteredAppointments = useMemo(() => {
        const today = new Date();
        const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());

        return appointments.filter(app => {
          if (!app.date) return false;
          const [ano, mes, dia] = app.date.split('-').map(Number);
          const appDate = new Date(ano, mes - 1, dia);

          if (effectivePro !== 'Todos' && app.pro !== effectivePro) return false;
          if (periodFilter === 'hoje') return app.date === getTodayISO();
          if (periodFilter === 'semana') {
            const startOfWeek = new Date(startOfToday);
            startOfWeek.setDate(today.getDate() - ((today.getDay() + 6) % 7));
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            return appDate >= startOfWeek && appDate <= endOfWeek;
          }
          if (periodFilter === 'mes') return appDate.getFullYear() === today.getFullYear() && appDate.getMonth() === today.getMonth();
          if (periodFilter === 'custom') return app.date >= customStart && app.date <= customEnd;
          return true;
        });
      }, [appointments, periodFilter, customStart, customEnd, effectivePro]);

      const faturamentoBruto = useMemo(() => filteredAppointments.reduce((acc, curr) => acc + (Number(curr.price) || 0), 0), [filteredAppointments]);
      const valorDesconto = (faturamentoBruto * (Number(discountPercent) || 0)) / 100;
      const faturamentoLiquido = faturamentoBruto - valorDesconto;

        if (!isAdmin) return [];
        const map = {};
        users.forEach(u => { map[u.name] = 0; });
        filteredAppointments.forEach(app => { map[app.pro] = (map[app.pro] || 0) + (Number(app.price) || 0); });
        return Object.entries(map).map(([name, total]) => ({
          name, total, pct: faturamentoBruto > 0 ? ((total / faturamentoBruto) * 100).toFixed(0) : 0
        }));
      }, [filteredAppointments, users, faturamentoBruto, isAdmin]);

    function App() {
      const savedSessionUser = (() => {

      const [users, setUsers] = useState([{ name: 'Carol', role: 'Administradora', password: '812463', isAdmin: true, isDev: false }]);
      const [services, setServices] = useState([]);
      const [appointments, setAppointments] = useState([]);
      const [clientsList, setClientsList] = useState([]);
      const [blockedDays, setBlockedDays] = useState([]);
      const [apiError, setApiError] = useState('');

      const [loginUser, setLoginUser] = useState(savedSessionUser || 'Carol');

      const [rememberPass, setRememberPass] = useState(true);
      const [savedCreds, setSavedCreds] = useState({});
      const [loginError, setLoginError] = useState('');

      const [wppTemplate, setWppTemplate] = useState(() => {
        try { return localStorage.getItem('espaco101_wpp_msg_template') || DEFAULT_WPP_TEMPLATE; } catch(e) { return DEFAULT_WPP_TEMPLATE; }
      });

      const [modal, setModal] = useState(false);
      const [dateModal, setDateModal] = useState(false);
      const [userModal, setUserModal] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [serviceModal, setServiceModal] = useState(false);
      const [editingService, setEditingService] = useState(null);
      const [toast, setToast] = useState('');
      const [detail, setDetail] = useState(null);
      const [isSaving, setIsSaving] = useState(false);

      const [blockModal, setBlockModal] = useState(false);
      const [blockType, setBlockType] = useState('full');
      const [blockStartTime, setBlockStartTime] = useState('12:00');
      const [blockEndTime, setBlockEndTime] = useState('13:30');
      const [blockReason, setBlockReason] = useState('Folga / Compromisso');
      const [isTogglingBlock, setIsTogglingBlock] = useState(false);

      const [appDate, setAppDate] = useState(getTodayISO());
      const [time, setTime] = useState('09:00');
      const [client, setClient] = useState('');
      const [clientPhone, setClientPhone] = useState('');
      const [showClientSuggestions, setShowClientSuggestions] = useState(false);
      const [service, setService] = useState('');
      const [professional, setProfessional] = useState('Carol');
      const [agendaProfessional, setAgendaProfessional] = useState('Carol');

      const [colabName, setColabName] = useState('');
      const [colabRole, setColabRole] = useState('Profissional');
      const [colabPass, setColabPass] = useState('');
      const [colabIsAdmin, setColabIsAdmin] = useState(false);

      const [servName, setServName] = useState('');
      const [servTime, setServTime] = useState('60 min');
      const [servPrice, setServPrice] = useState('100');

      const teamUsers = useMemo(() => {
        return users.filter(u => !u.isDev && String(u.role).toLowerCase() !== 'desenvolvedor');
      }, [users]);

      const clientSuggestions = useMemo(() => {
        const termo = client.trim().toLowerCase();
        if (!termo) return [];
        return clientsList.filter(c => String(c.name).toLowerCase().includes(termo));
      }, [client, clientsList]);

      useEffect(() => {
        (async () => {
          if ('serviceWorker' in navigator && 'PushManager' in window) {
            try {
              await navigator.serviceWorker.register('./sw.js');
              navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'PUSH_RECEIVED') {
                  tocarCampainhaNotificacao();
                  carregarDadosDaPlanilha();
                }
              });
              if (Notification.permission === 'default') {
                setShowNotifyBtn(true);
              } else if (Notification.permission === 'granted' && savedSessionUser) {
                registrarPushNoServidor(savedSessionUser);
              }
            } catch (e) {}
          }
        })();
      }, []);

      const handleAtivarNotificacoes = async () => {
        tocarCampainhaNotificacao();
        if (!('Notification' in window)) {
          setToast('⚠️ Adicione o app à Tela de Início primeiro.');
          setTimeout(() => setToast(''), 3500);
          return;
        }
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          setShowNotifyBtn(false);
          await registrarPushNoServidor(currentUser || 'Equipe');
          setToast('✅ Notificações e som ativados neste celular!');
        } else {
          setToast('⚠️ Permissão negada nos Ajustes do celular.');
        }
        setTimeout(() => setToast(''), 3500);
      };

      useEffect(() => {
        const creds = getSavedPasswords();
        setSavedCreds(creds);
        const target = loginUser || 'Carol';
        if (creds[target]) { setPassword(creds[target]); }
      }, [loginUser]);

      const carregarDadosDaPlanilha = async () => {
        setIsSyncing(true);
        const dados = await callAPI('obterDadosIniciais');
        setIsSyncing(false);

        if (dados && dados.usuarios && dados.usuarios.length > 0) {
          setUsers(dados.usuarios);
          if (dados.servicos) {
            setServices(dados.servicos);
            if (dados.servicos.length > 0 && !service) {
              setService(dados.servicos[0].name);
            }
          }
          if (dados.agendamentos) setAppointments(dados.agendamentos);
          if (dados.clientes) setClientsList(dados.clientes);
          if (dados.bloqueios) setBlockedDays(dados.bloqueios);
          setApiError('');

          const validTeam = dados.usuarios.filter(u => !u.isDev && String(u.role).toLowerCase() !== 'desenvolvedor');
          const firstTeamPro = validTeam[0]?.name || 'Carol';

          const stored = localStorage.getItem('espaco101_user_session') || '';
          if (stored) {
            const userMatch = dados.usuarios.find(u => u.name === stored);
            if (userMatch) {
              const eDev = userMatch.isDev || String(userMatch.role).toLowerCase() === 'desenvolvedor';
              setCurrentUser(userMatch.name);
              setAgendaProfessional(eDev ? firstTeamPro : userMatch.name);
              setProfessional(eDev ? firstTeamPro : userMatch.name);
              setLoggedIn(true);
              registrarPushNoServidor(userMatch.name);
            } else {
              localStorage.removeItem('espaco101_user_session');
              setLoggedIn(false);
            }
          }
        } else {
          setApiError(dados?.erro || 'Não foi possível sincronizar com o Google Sheets.');
        }
      };

      useEffect(() => { carregarDadosDaPlanilha(); }, []);

      const activeUserObj = users.find(u => u.name === currentUser) || users[0] || { name: 'Carol', role: 'Administradora', isAdmin: true };
      const isAdmin = activeUserObj?.isAdmin;

      const dayBlocks = useMemo(() => {
        return blockedDays.filter(b => 
          b.date === appDate && String(b.pro).trim().toLowerCase() === String(agendaProfessional).trim().toLowerCase()
        );
      }, [blockedDays, appDate, agendaProfessional]);

      const hasFullDayBlock = useMemo(() => dayBlocks.some(b => b.fullDay), [dayBlocks]);

      const canManageBlock = useMemo(() => {
        if (isAdmin) return true;
        return String(currentUser).trim().toLowerCase() === String(agendaProfessional).trim().toLowerCase();
      }, [isAdmin, currentUser, agendaProfessional]);

      const handleCreateBlock = async () => {
        if (isTogglingBlock) return;
        setIsTogglingBlock(true);
        const hIni = blockType === 'partial' ? blockStartTime : '';
        const hFim = blockType === 'partial' ? blockEndTime : '';

        const res = await callAPI('adicionarBloqueioAgenda', {
          data: appDate,
          proAlvo: agendaProfessional,
          motivo: blockReason,
          horaInicio: hIni,
          horaFim: hFim,
          usuarioLogado: currentUser
        });
        setIsTogglingBlock(false);
        setBlockModal(false);

        if (res && res.sucesso) {
          if (res.bloqueios) setBlockedDays(res.bloqueios);
          setToast(blockType === 'full' 
            ? `🔒 Dia inteiro bloqueado para ${agendaProfessional}!` 
            : `🔒 Horário (${hIni} às ${hFim}) bloqueado!`);
        } else {
          setToast('⚠️ ' + (res?.erro || 'Erro ao bloquear agenda.'));
        }
        setTimeout(() => setToast(''), 3500);
      };

      const handleRemoveBlock = async (blockObj) => {
        if (isTogglingBlock) return;
        setIsTogglingBlock(true);
        const res = await callAPI('removerBloqueioAgenda', {
          data: blockObj.date,
          proAlvo: blockObj.pro,
          horaInicio: blockObj.startTime,
          horaFim: blockObj.endTime,
          usuarioLogado: currentUser
        });
        setIsTogglingBlock(false);

        if (res && res.sucesso) {
          if (res.bloqueios) setBlockedDays(res.bloqueios);
          setToast('🔓 Bloqueio removido com sucesso!');
        } else {
          setToast('⚠️ ' + (res?.erro || 'Erro ao desbloquear.'));
        }
        setTimeout(() => setToast(''), 3500);
      };

      const handleSelectLoginUser = (name) => {
        setLoginUser(name);
        setLoginError('');
        const creds = getSavedPasswords();
        setPassword(creds[name] || '');
      };

      const handleLogin = (e) => {
        if (e) e.preventDefault();
        const found = users.find(u => u.name === loginUser);
        if (!found || String(found.password).trim() !== String(password).trim()) {
          setLoginError('Senha incorreta.');
          return;
        }

        try {
          localStorage.setItem('espaco101_user_session', found.name);
        } catch(err) {}

        if (rememberPass) {
          savePasswordForUser(found.name, password);
          setSavedCreds(getSavedPasswords());
        } else {
          removePasswordForUser(found.name);
          setSavedCreds(getSavedPasswords());
        }

        const eDev = found.isDev || String(found.role).toLowerCase() === 'desenvolvedor';
        const defaultPro = eDev ? (teamUsers[0]?.name || 'Carol') : found.name;

        setCurrentUser(found.name);
        setAgendaProfessional(defaultPro);
        setProfessional(defaultPro);
        setLoggedIn(true);
        setPassword('');
        setLoginError('');
        setTab('Início');
        registrarPushNoServidor(found.name);
      };

      const handleLogout = (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        try {
          localStorage.removeItem('espaco101_user_session');
        } catch(err) {}

        setCurrentUser('');
        setLoggedIn(false);
        setPassword('');
        setLoginError('');
        setTab('Início');
        setDrawerOpen(false);
        const creds = getSavedPasswords();
        if (creds[loginUser]) setPassword(creds[loginUser]);
      };

      // --- CRUD CLIENTES ---
      const handleSaveManualClient = async (name, phone) => {
        const nomeNorm = String(name || '').trim().replace(/\s+/g, ' ').toLowerCase();
        const telNorm = String(phone || '').replace(/\D/g, '');

        const jaExiste = clientsList.some(c => 
          String(c.name || '').trim().replace(/\s+/g, ' ').toLowerCase() === nomeNorm &&
          String(c.phone || '').replace(/\D/g, '') === telNorm
        );

        if (jaExiste) {
          setToast('⚠️ Cliente já cadastrado com este nome e número!');
          setTimeout(() => setToast(''), 3000);
          return false;
        }

        const res = await callAPI('salvarClientePlanilha', { nome: name, telefone: phone });
        if (res && res.sucesso) {
          if (res.clientes) setClientsList(res.clientes);
          setToast('Cliente cadastrado com sucesso!');
          setTimeout(() => setToast(''), 3000);
          return true;
        } else {
          setToast('⚠️ ' + (res?.erro || 'Erro ao salvar cliente.'));
          setTimeout(() => setToast(''), 3000);
          return false;
        }
      };

      const handleEditClient = async (oldName, oldPhone, newName, newPhone) => {
        const res = await callAPI('editarClientePlanilha', {
          nomeAntigo: oldName,
          telAntigo: oldPhone,
          novoNome: newName,
          novoTel: newPhone
        });
        if (res && res.sucesso) {
          if (res.clientes) setClientsList(res.clientes);
          setToast('Cliente atualizado com sucesso!');
          setTimeout(() => setToast(''), 3000);
          return true;
        } else {
          setToast('⚠️ ' + (res?.erro || 'Erro ao editar cliente.'));
          setTimeout(() => setToast(''), 3000);
          return false;
        }
      };

      const handleDeleteClient = async (name, phone) => {
        if (!window.confirm(`Deseja realmente excluir o cliente "${name}" da lista?`)) return;
        const res = await callAPI('excluirClientePlanilha', { nome: name, telefone: phone });
        if (res && res.sucesso) {
          if (res.clientes) setClientsList(res.clientes);
          setToast('Cliente excluído!');
        } else {
          setToast('⚠️ ' + (res?.erro || 'Erro ao excluir cliente.'));
        }
        setTimeout(() => setToast(''), 3000);
      };

      const formatWhatsappMessage = (template, app) => {
        if (!template || !app) return '';
        const dataFmt = app.date ? app.date.split('-').reverse().join('/') : '';
        const horaFmt = formatTime(app.time);
        const valorFmt = formatCurrency(app.price);

        return template
          .replace(/{cliente}/gi, app.client || 'Cliente')
          .replace(/{servico}/gi, app.service || 'Atendimento')
          .replace(/{data}/gi, dataFmt)
          .replace(/{horario}/gi, horaFmt)
          .replace(/{profissional}/gi, app.pro || '')
          .replace(/{valor}/gi, valorFmt);
      };

      const handleSendWhatsapp = (app) => {
        if (!app) return;
        const msg = formatWhatsappMessage(wppTemplate, app);
        const cleanPhone = String(app.phone || '').replace(/\D/g, '');
        let url = '';

        if (cleanPhone.length >= 10) {
          const finalPhone = cleanPhone.startsWith('55') ? cleanPhone : `55${cleanPhone}`;
          url = `https://api.whatsapp.com/send?phone=${finalPhone}&text=${encodeURIComponent(msg)}`;
        } else {
          url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
        }
        window.open(url, '_blank');
      };

      const handleSaveWppTemplateDirect = (newText) => {
        setWppTemplate(newText);
        try { localStorage.setItem('espaco101_wpp_msg_template', newText); } catch(e) {}
        setToast('Mensagem padrão do WhatsApp salva!');
        setTimeout(() => setToast(''), 3000);
      };

      const handleOpenUserModal = (u = null) => {
        setEditingUser(u);
        setColabName(u ? u.name : '');
        setColabRole(u ? u.role : 'Profissional');
        setColabPass(u ? u.password : '');
        setColabIsAdmin(u ? !!u.isAdmin : false);
        setUserModal(true);

      const handleSaveUser = async () => {
        if (!colabName.trim() || !colabPass.trim()) return setToast('Preencha nome e senha.');
        const cargoFinal = colabRole.trim() || 'Profissional';
        const eDev = cargoFinal.toLowerCase() === 'desenvolvedor' || cargoFinal.toLowerCase() === 'dev';

        const dados = { 
          name: colabName.trim(), 
          role: cargoFinal, 
          password: colabPass.trim(), 
          isAdmin: eDev || colabIsAdmin,
          isDev: eDev
        };

        await callAPI('salvarColaborador', { dados, nomeAntigo: editingUser ? editingUser.name : null });
        setUsers(editingUser ? users.map(u => u.name === editingUser.name ? dados : u) : [...users, dados]);
        setUserModal(false);
        setToast('Profissional salva com sucesso!');
        setTimeout(() => setToast(''), 3000);
      };

      const handleDeleteUser = async () => {
        if (!editingUser || editingUser.name.toLowerCase() === 'carol') return setToast('A administradora não pode ser excluída.');
        if (!confirm(`Excluir ${editingUser.name}?`)) return;
        await callAPI('excluirColaborador', { nome: editingUser.name });
        setUsers(users.filter(u => u.name !== editingUser.name));
        setUserModal(false);
        setToast('Profissional removida!');
        setTimeout(() => setToast(''), 3000);
      };

      const handleOpenServiceModal = (s = null) => {
        setEditingService(s);
        setServName(s ? s.name : '');
        setServTime(s ? s.time : '60 min');
        setServPrice(s ? String(s.price) : '');
        setServiceModal(true);
      };

      const handleSaveService = async () => {
        if (!servName.trim() || !servPrice) return setToast('Preencha nome e preço.');
        const novo = { name: servName.trim(), time: servTime.trim() || '45 min', price: Number(servPrice) || 0 };
        await callAPI('salvarServico', { novo, nomeAntigo: editingService ? editingService.name : null });
        setServices(editingService ? services.map(s => s.name === editingService.name ? novo : s) : [...services, novo]);
        setServiceModal(false);
        setToast('Serviço salvo com sucesso!');
        setTimeout(() => setToast(''), 3000);
      };

      const handleDeleteService = async () => {
        if (!editingService) return;
        if (!confirm(`Excluir o serviço ${editingService.name}?`)) return;
        await callAPI('excluirServico', { nome: editingService.name });
        setServices(services.filter(s => s.name !== editingService.name));
        setServiceModal(false);
        setToast('Serviço removido.');
        setTimeout(() => setToast(''), 3000);
      };

      const addAppointment = async () => {
        if (isSaving) return;

        const hojeISO = getTodayISO();
        const cleanStart = formatTime(time);

        if (appDate < hojeISO) {
          setToast('⚠️ Não é permitido agendar para datas que já passaram.');
          setTimeout(() => setToast(''), 3500);
          return;
        }

        if (appDate === hojeISO) {
          const agora = new Date();
          const agoraMin = agora.getHours() * 60 + agora.getMinutes();
          if (timeToMinutes(cleanStart) < agoraMin) {
            setToast('⚠️ Não é permitido agendar para um horário que já passou.');
            setTimeout(() => setToast(''), 3500);
            return;
          }
        }

        const actualService = service || (services[0] ? services[0].name : 'Atendimento');
        const selectedServiceObj = services.find(s => s.name === actualService);
        const precoServico = selectedServiceObj ? Number(selectedServiceObj.price) : 0;
        const duracaoMinutos = selectedServiceObj ? parseMinutes(selectedServiceObj.time) : 60;
        
        const cleanEnd = addMinutesToTime(cleanStart, duracaoMinutos);
        const newStart = timeToMinutes(cleanStart);
        const newEnd = timeToMinutes(cleanEnd);

        const bloqueiosDoDia = blockedDays.filter(b => 
          b.date === appDate && String(b.pro).trim().toLowerCase() === String(professional).trim().toLowerCase()
        );
        for (const bl of bloqueiosDoDia) {
          if (bl.fullDay) {
            return setToast(`🔒 Agenda de ${professional} bloqueada neste dia (${bl.reason}).`);
          }
          const bStart = timeToMinutes(bl.startTime);
          const bEnd = timeToMinutes(bl.endTime);
          if (newStart < bEnd && newEnd > bStart) {
            return setToast(`🔒 Horário bloqueado (${bl.startTime} às ${bl.endTime} - ${bl.reason}).`);
          }
        }

        const conflito = appointments.find(item => {
          if (item.date !== appDate || item.pro !== professional || item.status === 'cancelado') return false;
          return newStart < timeToMinutes(item.end) && newEnd > timeToMinutes(item.time);
        });

        if (conflito) return setToast(`⚠️ ${professional} já possui cliente neste horário!`);

        setIsSaving(true);

        const novoItem = {
          date: appDate, time: cleanStart, end: cleanEnd,
          client: client.trim() || 'Cliente sem nome',
          phone: clientPhone.trim(),
          service: actualService,
          pro: professional, price: precoServico, status: 'agendado'
        };

        const res = await callAPI('salvarAgendamento', { dados: novoItem });
        setIsSaving(false);

        if (res && res.sucesso) {
          setAppointments(prev => [...prev, novoItem]);
          if (res.clientes) setClientsList(res.clientes);
          setAgendaProfessional(professional);
          setModal(false);
          setClient('');
          setClientPhone('');
          setShowClientSuggestions(false);
          setToast('Horário agendado com sucesso!');
        } else {
          setToast('⚠️ ' + (res?.erro || 'Erro ao gravar na planilha.'));
        }
        setTimeout(() => setToast(''), 3500);
      };

      const toggleAppointmentStatus = async (index) => {
        const item = appointments[index];
        if (!item) return;
        const novoStatus = item.status === 'confirmado' ? 'agendado' : 'confirmado';
        await callAPI('atualizarStatusAgendamento', {
          data: item.date,
          hora: item.time,
          cliente: item.client,
          pro: item.pro,
          novoStatus

        const updated = [...appointments];
        updated[index] = { ...item, status: novoStatus };
        setAppointments(updated);

                                </div>
                              </div>
                              {canManageBlock && (
                                <button
                                  type="button"
                                  disabled={isTogglingBlock}
                                  onClick={() => handleRemoveBlock(bl)}
                                  className="flex items-center gap-1 rounded-xl bg-white border border-red-200 px-2.5 py-1.5 text-[11px] font-bold text-emerald-700 hover:bg-emerald-50 transition shrink-0">
                                  <Icon name="unlock" size={13} />
                                  <span>Desbloquear</span>
                                </button>
                              )}
                            </div>
                          ))}
                        </div>
                      )}

                      <div className="divide-y divide-stone-100">
                        {professionalAppointments.map(({ item, index }) => (
                          <button key={`${item.time}-${item.client}`} type="button" onClick={() => setDetail(index)} className="flex w-full gap-3 px-4 py-4 text-left transition hover:bg-[#fcf8f6]">
                            <div className="w-14 shrink-0 pt-1">
                              <p className="text-sm font-bold text-stone-800">{formatTime(item.time)}</p>
                              <p className="text-[10px] text-stone-400">{formatTime(item.end)}</p>
                            </div>
                            <div className={`w-1 rounded-full ${item.status === 'confirmado' ? 'bg-emerald-400' : 'bg-amber-400'}`}></div>
                            <div className="flex min-w-0 flex-1 items-center gap-3">
                              <div className="grid w-10 h-10 shrink-0 place-items-center rounded-full bg-rose-100 text-xs font-bold text-rose-700">{String(item.client).slice(0, 2).toUpperCase()}</div>
                              <div className="min-w-0 flex-1">
                                <p className="truncate text-sm font-bold text-stone-800">{item.client}</p>
                                <p className="text-xs text-stone-500 truncate">{item.service} · {formatCurrency(item.price)}</p>
                              </div>
                              <span className={`text-[10px] uppercase font-bold px-2.5 py-1 rounded-full ${item.status === 'confirmado' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}`}>
                                {item.status === 'confirmado' ? 'Confirmado' : 'Agendado'}
                              </span>
                            </div>
                          </button>
                        ))}
                        {professionalAppointments.length === 0 && (
                          <div className="px-5 py-16 text-center text-stone-400">
                            <p className="font-bold text-stone-700">{hasFullDayBlock ? 'Agenda fechada nesta data' : 'Nenhum horário marcado'}</p>
                            <p className="text-xs text-stone-400 mt-1">
                              {hasFullDayBlock 
                                ? 'Desbloqueie acima caso queira liberar agendamentos.' 
                                : `${agendaProfessional} está com a agenda livre nesta data.`}
                            </p>
                          </div>
                        )}
                      </div>
                    </section>
                  </div>
                ) : (
                  <OtherPage 
                    tab={tab} 
                    isAdmin={isAdmin} 
                    currentUser={currentUser} 
                    users={teamUsers} 
                    allUsers={users}
                    services={services} 
                    appointments={appointments}
                    clientsList={clientsList}
                    onSaveClient={handleSaveManualClient}
                    onEditClient={handleEditClient}
                    onDeleteClient={handleDeleteClient}
                    wppTemplate={wppTemplate}
                    onSaveWppTemplateDirect={handleSaveWppTemplateDirect}
                    formatWhatsappMessage={formatWhatsappMessage}
                    onOpenUserModal={handleOpenUserModal} 
                    onEditUser={handleOpenUserModal} 
                    onOpenServiceModal={handleOpenServiceModal} 
                    onEditService={handleOpenServiceModal} 
                    onSelectAppointment={idx => setDetail(idx)} 
                  />
                )}
              </div>
            </main>

            {(tab === 'Início' || tab === 'Agenda' || tab === 'Clientes') && (
              <button 
                type="button" 
                onClick={() => {
                  setShowClientSuggestions(false);
                  if (appDate < getTodayISO()) setAppDate(getTodayISO());
                  setModal(true);
                }} 
                aria-label="Novo horário" 
                className="fixed bottom-20 right-8 lg:bottom-12 lg:right-14 z-30 grid w-14 h-14 place-items-center rounded-full bg-[#6f424a] text-white shadow-2xl border border-white/20 active:scale-95 hover:bg-[#5b363d] transition-all">
                <Icon name="plus" size={24} />
              </button>
            )}
          </div>

          {/* MODAL BLOQUEAR DIA INTEIRO OU HORÁRIO ESPECÍFICO */}
          {blockModal && (
            <div onMouseDown={() => setBlockModal(false)} className="fixed inset-0 z-50 flex items-center justify-center bg-stone-950/40 backdrop-blur-sm p-4 w-full">
              <div onMouseDown={e => e.stopPropagation()} className="w-full max-w-sm rounded-3xl bg-white p-6 shadow-2xl border border-stone-100">
                <div className="flex items-center justify-between pb-3 border-b border-stone-100">
                  <div className="flex items-center gap-2">
                    <span className="grid w-7 h-7 place-items-center rounded-lg bg-red-100 text-red-700">
                      <Icon name="lock" size={15} />
                    </span>
                    <h3 className="font-serif text-lg font-bold text-stone-900">Bloquear Agenda</h3>
                  </div>
                  <button type="button" onClick={() => setBlockModal(false)} className="grid w-8 h-8 place-items-center rounded-full bg-stone-100 text-stone-500">
                    <Icon name="x" size={16} />
                  </button>
                </div>

                <div className="mt-4 space-y-4">
                  <p className="text-xs text-stone-600 leading-relaxed">
                    Agenda de <b>{agendaProfessional}</b> em <b>{appDate.split('-').reverse().join('/')}</b>:
                  </p>

                  <div className="grid grid-cols-2 gap-2 rounded-2xl bg-stone-100 p-1.5">
                    <button
                      type="button"
                      onClick={() => setBlockType('full')}
                      className={`rounded-xl py-2 text-xs font-bold transition ${blockType === 'full' ? 'bg-white text-[#6f424a] shadow-xs' : 'text-stone-500'}`}>
                      Dia Inteiro
                    </button>
                    <button
                      type="button"
                      onClick={() => setBlockType('partial')}
                      className={`rounded-xl py-2 text-xs font-bold transition ${blockType === 'partial' ? 'bg-white text-[#6f424a] shadow-xs' : 'text-stone-500'}`}>
                      Horário Específico
                    </button>
                  </div>

                  {blockType === 'partial' && (
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-bold text-stone-600 block mb-1">Das (Início)</label>
                        <input
                          type="time"
                          value={blockStartTime}
                          onChange={e => setBlockStartTime(e.target.value)}
                          className="w-full rounded-xl border border-stone-200 px-3 py-2 text-sm outline-none bg-stone-50 focus:bg-white focus:border-[#9d6269]"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-stone-600 block mb-1">Até (Término)</label>
                        <input
                          type="time"
                          value={blockEndTime}
                          onChange={e => setBlockEndTime(e.target.value)}
                          className="w-full rounded-xl border border-stone-200 px-3 py-2 text-sm outline-none bg-stone-50 focus:bg-white focus:border-[#9d6269]"
                        />
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="text-xs font-bold text-stone-600 block mb-1">Motivo do bloqueio:</label>
                    <input 
                      type="text" 
                      value={blockReason} 
                      onChange={e => setBlockReason(e.target.value)} 
                      placeholder="Ex: Almoço, Folga, Curso..."
                      className="w-full rounded-xl border border-stone-200 px-3.5 py-2.5 text-sm outline-none bg-stone-50 focus:bg-white focus:border-[#9d6269]"
                    />
                  </div>
                </div>

                <div className="mt-5 flex gap-2">
                  <button type="button" onClick={() => setBlockModal(false)} className="flex-1 rounded-xl border border-stone-200 py-2.5 text-xs font-bold text-stone-600 hover:bg-stone-50 transition">
                    Cancelar
                  </button>
                  <button 
                    type="button" 
                    disabled={isTogglingBlock}
                    onClick={handleCreateBlock} 
                    className="flex-1 rounded-xl bg-red-600 py-2.5 text-xs font-bold text-white hover:bg-red-700 transition">
                    {isTogglingBlock ? 'Bloqueando...' : 'Confirmar Bloqueio'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL SERVIÇOS */}
          {serviceModal && (
            <div onMouseDown={() => setServiceModal(false)} className="fixed inset-0 z-50 flex items-center justify-center bg-stone-950/40 backdrop-blur-sm p-4 w-full">
              <div onMouseDown={e => e.stopPropagation()} className="w-full max-w-sm rounded-3xl bg-white p-6 shadow-2xl border border-stone-100">
                <div className="flex items-center justify-between pb-3 border-b border-stone-100">
                  <h3 className="font-serif text-lg font-bold text-stone-900">{editingService ? 'Editar Serviço' : 'Novo Serviço'}</h3>
                  <button type="button" onClick={() => setServiceModal(false)} className="grid w-8 h-8 place-items-center rounded-full bg-stone-100 text-stone-500"><Icon name="x" size={16} /></button>
                </div>
                <div className="mt-4 space-y-3">
                  <div>
                    <label className="text-xs font-bold text-stone-600 block mb-1">Nome do Procedimento</label>
                    <input type="text" value={servName} onChange={e => setServName(e.target.value)} placeholder="Ex: Manicure, Mechas..." className="w-full rounded-xl border border-stone-200 px-3 py-2 text-sm outline-none bg-stone-50"/>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-stone-600 block mb-1">Duração</label>
                      <input type="text" value={servTime} onChange={e => setServTime(e.target.value)} placeholder="60 min" className="w-full rounded-xl border border-stone-200 px-3 py-2 text-sm outline-none bg-stone-50"/>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-stone-600 block mb-1">Preço (R$)</label>
                      <input type="number" step="0.01" value={servPrice} onChange={e => setServPrice(e.target.value)} placeholder="100.00" className="w-full rounded-xl border border-stone-200 px-3 py-2 text-sm outline-none bg-stone-50"/>
                    </div>
                  </div>
                </div>
                <div className="mt-5 space-y-2">
                  <button type="button" onClick={handleSaveService} className="w-full rounded-xl bg-[#6f424a] py-3 text-sm font-bold text-white hover:bg-[#5b363d] transition">Salvar Serviço</button>
                  {editingService && (
                    <button type="button" onClick={handleDeleteService} className="w-full rounded-xl border border-red-200 py-2.5 text-xs font-bold text-red-600 hover:bg-red-50 transition">Excluir Serviço</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL PROFISSIONAIS */}
          {userModal && (
            <div onMouseDown={() => setUserModal(false)} className="fixed inset-0 z-50 flex items-center justify-center bg-stone-950/40 backdrop-blur-sm p-4 w-full">
              <div onMouseDown={e => e.stopPropagation()} className="w-full max-w-sm rounded-3xl bg-white p-6 shadow-2xl border border-stone-100 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-stone-100">
                  <h3 className="font-serif text-lg font-bold text-stone-900">{editingUser ? 'Editar Perfil' : 'Nova Profissional'}</h3>
                  <button type="button" onClick={() => setUserModal(false)} className="grid w-8 h-8 place-items-center rounded-full bg-stone-100 text-stone-500"><Icon name="x" size={16} /></button>
                </div>
                <div className="mt-4 space-y-3">
                  <div>
                    <label className="text-xs font-bold text-stone-600 block mb-1">Nome</label>
                    <input type="text" value={colabName} onChange={e => setColabName(e.target.value)} placeholder="Nome" className="w-full rounded-xl border border-stone-200 px-3 py-2 text-sm outline-none bg-stone-50"/>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-stone-600 block mb-1">Função / Cargo</label>
                    <input type="text" value={colabRole} onChange={e => setColabRole(e.target.value)} placeholder="Ex: Cabeleireira, Manicure, Desenvolvedor" className="w-full rounded-xl border border-stone-200 px-3 py-2 text-sm outline-none bg-stone-50"/>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-stone-600 block mb-1">Senha de Acesso</label>
                    <input type="password" value={colabPass} onChange={e => setColabPass(e.target.value)} placeholder="Defina uma senha" className="w-full rounded-xl border border-stone-200 px-3 py-2 text-sm outline-none bg-stone-50"/>
                  </div>
                  <div className="pt-1">
                    <label className="flex items-center gap-2.5 p-2 rounded-xl bg-stone-50 border border-stone-200/80 cursor-pointer select-none">
                      <input 
                        type="checkbox" 
                        checked={colabIsAdmin} 
                        onChange={e => setColabIsAdmin(e.target.checked)} 
                        className="w-4 h-4 rounded text-[#6f424a] accent-[#6f424a]"
                      />
                      <div>
                        <span className="text-xs font-bold text-stone-800 block">Acesso Administrador</span>
                        <span className="text-[10px] text-stone-400 block">Pode gerenciar equipe, procedimentos e financeiro</span>
                      </div>
                    </label>
                  </div>
                </div>
                <div className="mt-5 space-y-2">
                  <button type="button" onClick={handleSaveUser} className="w-full rounded-xl bg-[#6f424a] py-3 text-sm font-bold text-white hover:bg-[#5b363d] transition">Salvar Perfil</button>
                  {editingUser && editingUser.name.toLowerCase() !== 'carol' && (
                    <button type="button" onClick={handleDeleteUser} className="w-full rounded-xl border border-red-200 py-2.5 text-xs font-bold text-red-600 hover:bg-red-50 transition">Excluir Perfil</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL DATA */}
          {dateModal && (
            <div onMouseDown={() => setDateModal(false)} className="fixed inset-0 z-50 flex items-center justify-center bg-stone-950/40 backdrop-blur-sm p-4 w-full">
              <div onMouseDown={e => e.stopPropagation()} className="w-full max-w-sm rounded-3xl bg-white p-5 sm:p-6 shadow-2xl border border-stone-100 overflow-hidden">
                <div className="flex items-center justify-between pb-3 border-b border-stone-100">
                  <h3 className="font-serif text-lg font-bold text-stone-900">Escolher Data</h3>
                  <button type="button" onClick={() => setDateModal(false)} className="grid w-8 h-8 place-items-center rounded-full bg-stone-100 text-stone-500"><Icon name="x" size={16} /></button>
                </div>
                <div className="mt-4 space-y-4">
                  <button type="button" onClick={() => { setAppDate(getTodayISO()); setDateModal(false); }} className="w-full flex items-center justify-center gap-2 rounded-2xl bg-[#faf0ed] hover:bg-[#f3ded9] text-[#6f424a] py-3 text-sm font-bold border border-rose-200/60 transition">
                    <Icon name="sparkles" size={16} /> Ir para Hoje ({new Date().toLocaleDateString('pt-BR')})
                  </button>
                  <input type="date" value={appDate} onChange={e => { if (e.target.value) setAppDate(e.target.value); }} className="w-full block rounded-2xl border border-stone-200 bg-stone-50 px-3 py-2.5 text-sm font-semibold text-center outline-none"/>
                </div>
                <button type="button" onClick={() => setDateModal(false)} className="mt-5 w-full rounded-xl bg-[#6f424a] py-3 text-sm font-bold text-white transition">Confirmar Data</button>
              </div>
            </div>
          )}

          {/* MODAL NOVO AGENDAMENTO */}
          {modal && (
            <div onMouseDown={() => setModal(false)} className="fixed inset-0 z-50 grid place-items-end bg-stone-950/35 backdrop-blur-sm sm:place-items-center sm:p-4">
              <div onMouseDown={e => e.stopPropagation()} className="w-full rounded-t-[2rem] bg-white p-6 sm:max-w-md sm:rounded-[2rem] max-h-[90vh] overflow-y-auto">
                <div className="flex items-start justify-between">
                  <h2 className="font-serif text-2xl font-bold">Novo agendamento</h2>
                  <button type="button" onClick={() => setModal(false)} className="grid w-9 h-9 place-items-center rounded-full bg-stone-100"><Icon name="x" size={17}/></button>
                </div>
                <div className="mt-5 space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="relative">
                      <span className="text-xs font-bold text-stone-600 block">Cliente</span>
                      <input 
                        value={client} 
                        onFocus={() => setShowClientSuggestions(true)}
                        onChange={e => { setClient(e.target.value); setShowClientSuggestions(true); }} 
                        placeholder="Digite o nome (ex: João)..." 
                        autoComplete="off"
                        className="mt-1 w-full rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 text-sm outline-none focus:border-[#9d6269] focus:bg-white" 
                      />
                      {showClientSuggestions && clientSuggestions.length > 0 && (
                        <div className="absolute left-0 right-0 top-full mt-1 z-50 max-h-44 overflow-y-auto rounded-2xl border border-stone-200 bg-white shadow-xl divide-y divide-stone-100">
                          {clientSuggestions.map((c, idx) => (
                            <button
                              key={`${c.name}-${idx}`}
                              type="button"
                              onClick={() => {
                                setClient(c.name);
                                if (c.phone) setClientPhone(c.phone);
                                setShowClientSuggestions(false);
                              }}
                              className="flex w-full items-center justify-between px-3.5 py-2.5 text-left hover:bg-[#fcf8f6] transition">
                              <span className="text-xs font-bold text-stone-800 truncate">{c.name}</span>
                              <span className="text-[11px] text-stone-400 ml-2 shrink-0">{c.phone || ''}</span>
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                    <label className="block">
                      <span className="text-xs font-bold text-stone-600">WhatsApp (opcional)</span>
                      <input value={clientPhone} onChange={e => setClientPhone(e.target.value)} placeholder="(51) 99999-9999" className="mt-1 w-full rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 text-sm outline-none" />
                    </label>
                  </div>
                  <label className="block">
                    <span className="text-xs font-bold text-stone-600">Serviço</span>
                    <select value={service} onChange={e => setService(e.target.value)} className="mt-1 w-full rounded-xl border border-stone-200 bg-white px-4 py-3 text-sm outline-none">
                      {services.map(s => <option key={s.name} value={s.name}>{s.name} ({formatCurrency(s.price)})</option>)}
                    </select>
                  </label>
                  <div className="grid grid-cols-2 gap-3">
                    <label>
                      <span className="text-xs font-bold text-stone-600">Data</span>
                      <input type="date" min={getTodayISO()} value={appDate < getTodayISO() ? getTodayISO() : appDate} onChange={e => setAppDate(e.target.value)} className="mt-1 w-full rounded-xl border border-stone-200 px-3 py-2.5 text-sm outline-none bg-white" />
                    </label>
                    <label>
                      <span className="text-xs font-bold text-stone-600">Início</span>
                      <input type="time" value={time} onChange={e => setTime(e.target.value)} className="mt-1 w-full rounded-xl border border-stone-200 px-3 py-2.5 text-sm outline-none bg-white" />
                    </label>
                  </div>
                  <label className="block">
                    <span className="text-xs font-bold text-stone-600">Profissional</span>
                    <select value={professional} onChange={e => setProfessional(e.target.value)} className="mt-1 w-full rounded-xl border border-stone-200 bg-white px-4 py-3 text-sm outline-none">
                      {teamUsers.map(u => <option key={u.name} value={u.name}>{u.name} ({u.role})</option>)}
                    </select>
                  </label>
                </div>
                <button 
                  type="button" 
                  onClick={addAppointment} 
                  disabled={isSaving}
                  className={`mt-6 w-full rounded-xl py-3.5 text-sm font-bold text-white transition ${
                    isSaving ? 'bg-stone-400 cursor-not-allowed' : 'bg-[#6f424a] hover:bg-[#5b363d]'
                  }`}>
                  {isSaving ? 'Agendando...' : 'Confirmar Agendamento'}
                </button>
              </div>
            </div>
          )}

          {/* MODAL DETALHES */}
          {detail !== null && appointments[detail] && (
            <div onMouseDown={() => setDetail(null)} className="fixed inset-0 z-50 grid place-items-end bg-stone-950/35 backdrop-blur-sm sm:place-items-center sm:p-4">
              <div onMouseDown={e => e.stopPropagation()} className="w-full rounded-t-[2rem] bg-white p-6 sm:max-w-sm sm:rounded-[2rem]">
                <div className="flex justify-between items-start">
                  <div>
                    <span className={`text-[10px] uppercase font-bold px-2.5 py-0.5 rounded-full inline-block ${appointments[detail].status === 'confirmado' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                      Status: {appointments[detail].status}
                    </span>
                    <h2 className="font-serif text-2xl font-bold mt-1">{appointments[detail].client}</h2>
                  </div>
                  <button type="button" onClick={() => setDetail(null)} className="grid w-9 h-9 place-items-center rounded-full bg-stone-100"><Icon name="x" size={17}/></button>
                </div>
                
                <div className="my-4 rounded-2xl bg-stone-50 p-4 space-y-1.5">
                  <p className="text-sm font-bold text-stone-800">{appointments[detail].service} · {formatCurrency(appointments[detail].price)}</p>
                  <p className="text-xs text-stone-500">📅 Data: {appointments[detail].date.split('-').reverse().join('/')} às {formatTime(appointments[detail].time)}–{formatTime(appointments[detail].end)}</p>
                  <p className="text-xs text-stone-400">💅 Profissional: {appointments[detail].pro}</p>
                  {appointments[detail].phone ? (
                    <p className="text-xs text-stone-600 font-semibold pt-1">📱 {appointments[detail].phone}</p>
                  ) : (
                    <p className="text-[11px] text-stone-400 italic pt-1">Sem telefone cadastrado (abrirá o WhatsApp para escolher contato)</p>
                  )}
                </div>

                <div className="space-y-2">
                  <div className="flex gap-2 items-center">
                    <button 
                      type="button" 
                      onClick={() => handleSendWhatsapp(appointments[detail])} 
                      className="flex-1 flex items-center justify-center gap-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 py-3 text-sm font-bold text-white transition shadow-sm active:scale-98">
                      <Icon name="whatsapp" size={18} />
                      <span>Enviar WhatsApp</span>
                    </button>
                    <button 
                      type="button" 
                      onClick={() => { setDetail(null); setTab('Mensagem WhatsApp'); }} 
                      title="Editar mensagem padrão do WhatsApp" 
                      className="grid w-11 h-11 shrink-0 place-items-center rounded-xl border border-stone-200 bg-stone-50 hover:bg-stone-100 text-stone-600 transition shadow-sm">
                      <Icon name="settings" size={17} />
                    </button>
                  </div>

                  <button type="button" onClick={() => toggleAppointmentStatus(detail)} className={`w-full rounded-xl py-3 text-sm font-bold flex items-center justify-center gap-2 transition ${appointments[detail].status === 'confirmado' ? 'bg-amber-500 text-white hover:bg-amber-600' : 'bg-stone-800 text-white hover:bg-stone-900'}`}>
                    {appointments[detail].status === 'confirmado' ? '↩ Reverter para Agendado' : '✓ Confirmar Atendimento'}
                  </button>
                  <button type="button" onClick={() => cancelAppointment(detail)} className="w-full rounded-xl border border-red-200 py-2.5 text-xs font-bold text-red-600 hover:bg-red-50 transition">Cancelar Horário</button>
                </div>
              </div>
            </div>
          )}

          {toast && (
            <div className="fixed bottom-24 left-1/2 z-[80] -translate-x-1/2 whitespace-nowrap rounded-xl bg-stone-900 px-4 py-3 text-sm font-medium text-white shadow-xl">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
