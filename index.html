<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Espaço 101" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./logo.png" />
  <link rel="icon" type="image/png" href="./logo.png" />
  <title>Espaço 101 - Gestão</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #f8f5f2; font-family: sans-serif; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #btnNotify {
      position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
      z-index: 9999; background: #251d20; color: #eeb9af; border: 1px solid #6f424a;
      padding: 11px 20px; border-radius: 999px; font-size: 12px; font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); cursor: pointer; display: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <button id="btnNotify" onclick="ativarNotificacoes()">🔔 Ativar Notificações neste Celular</button>
  
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycby2LVsIAlXthCBCUUXSfU-7KAx8p_PLwUJkTfOZz5ad5xohc8lhdFU0ZpAiR7Qs-lz6/exec"></iframe>

  <script>
    const VAPID_PUBLIC_KEY = "BMGDyo7TIpfyKf5z_9Dy5pcyARHAv25n-fZcANGUtL8s6nHDlYRtqFiQniMZsahQV3Ez2s6gMmcZVKl1Lb7riXU";
    const GAS_URL = document.getElementById("appFrame").src;

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    async function iniciarPWA() {
      if ('serviceWorker' in navigator && 'PushManager' in window) {
        await navigator.serviceWorker.register('./sw.js');
        if (Notification.permission === 'default') {
          document.getElementById('btnNotify').style.display = 'block';
        } else if (Notification.permission === 'granted') {
          registrarAssinatura();
        }
      }
    }

    async function ativarNotificacoes() {
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        document.getElementById('btnNotify').style.display = 'none';
        await registrarAssinatura();
        alert('✅ Notificações ativadas neste aparelho!');
      } else {
        alert('⚠️ Permissão bloqueada. Libere as notificações nas configurações do navegador.');
      }
    }

    async function registrarAssinatura() {
      try {
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });
        }
        const usuarioAtual = localStorage.getItem('espaco101_user_session') || 'Equipe';
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            acao: 'registrar_push',
            usuario: usuarioAtual,
            subscription: sub.toJSON()
          })
        });
      } catch (e) {
        console.error('Erro ao registrar push:', e);
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'AUTO_LOGIN') {
        localStorage.setItem('espaco101_user_session', event.data.user);
        if (Notification.permission === 'granted') registrarAssinatura();
      }
    });

    iniciarPWA();
  </script>
</body>
</html>
