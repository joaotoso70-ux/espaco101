<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Espaço 101</title>
  
  <link rel="apple-touch-icon" sizes="180x180" href="https://joaotoso70-ux.github.io/espaco101/logo.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://joaotoso70-ux.github.io/espaco101/logo.png">
  <link rel="shortcut icon" href="https://joaotoso70-ux.github.io/espaco101/logo.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Espaço 101">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f5f2;
      position: fixed;
      inset: 0;
    }
    iframe {
      border: 0;
      position: absolute;
      top: -50px;
      left: 0;
      width: 100%;
      height: calc(100% + 50px);
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="agendaFrame" allow="fullscreen"></iframe>

  <script>
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycby2LVsIAlXthCBCUUXSfU-7KAx8p_PLwUJkTfOZz5ad5xohc8lhdFU0ZpAiR7Qs-lz6/exec";
    
    // Recupera o login salvo no iPhone pelo GitHub
    const savedUser = localStorage.getItem('espaco101_user') || '';
    const savedPass = localStorage.getItem('espaco101_pass') || '';
    
    let destUrl = GOOGLE_URL;
    if (savedUser && savedPass) {
      destUrl += "?u=" + encodeURIComponent(savedUser) + "&p=" + encodeURIComponent(savedPass);
    }
    
    document.getElementById('agendaFrame').src = destUrl;

    // Escuta comandos de Login e Logout vindos da agenda
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'AUTO_LOGIN') {
        localStorage.setItem('espaco101_user', event.data.user);
        localStorage.setItem('espaco101_pass', event.data.pass);
      }
      if (event.data && event.data.type === 'LOGOUT') {
        localStorage.removeItem('espaco101_user');
        localStorage.removeItem('espaco101_pass');
      }
    });
  </script>
</body>
</html>
