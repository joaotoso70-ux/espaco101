<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Espaço 101" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./logo.png" />
  <link rel="icon" type="image/png" href="./logo.png" />
  <title>Espaço 101 - Gestão</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      background: #f8f5f2; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px; color: #6f424a;
    }
    img { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); border: 1px solid #e7d8ce; }
    .btn {
      margin-top: 20px; background: #251d20; color: #eeb9af; border: 1px solid #6f424a;
      padding: 13px 22px; border-radius: 999px; font-size: 13px; font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2); cursor: pointer; display: none;
    }
  </style>
</head>
<body>
  <img src="./logo.png" alt="Espaço 101" />
  <p id="statusText" style="font-size: 13px; font-weight: 700; letter-spacing: 1.5px;">ABRINDO ESPAÇO 101...</p>
  <button id="btnNotify" class="btn" onclick="ativarNotificacoes()">🔔 Ativar Notificações neste Celular</button>

  <script>
    const BASE_GAS_URL = "https://script.google.com/macros/s/AKfycby2LVsIAlXthCBCUUXSfU-7KAx8p_PLwUJkTfOZz5ad5xohc8lhdFU0ZpAiR7Qs-lz6/exec";
    const VAPID_PUBLIC_KEY = "BMGDyo7TIpfyKf5z_9Dy5pcyARHAv25n-fZcANGUtL8s6nHDlYRtqFiQniMZsahQV3Ez2s6gMmcZVKl1Lb7riXU";

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('logout') === '1') {
      localStorage.removeItem('espaco101_auth_u');
      localStorage.removeItem('espaco101_auth_p');
    } else if (urlParams.get('u') && urlParams.get('p')) {
      localStorage.setItem('espaco101_auth_u', urlParams.get('u'));
      localStorage.setItem('espaco101_auth_p', urlParams.get('p'));
    }

    const savedU = localStorage.getItem('espaco101_auth_u') || '';
    const savedP = localStorage.getItem('espaco101_auth_p') || '';
    const githubReturnUrl = window.location.origin + window.location.pathname;

    const targetUrl = (savedU && savedP)
      ? `${BASE_GAS_URL}?u=${encodeURIComponent(savedU)}&p=${encodeURIComponent(savedP)}&gh=${encodeURIComponent(githubReturnUrl)}`
      : `${BASE_GAS_URL}?gh=${encodeURIComponent(githubReturnUrl)}`;

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    async function registrarAssinatura() {
      try {
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });
        }
        await fetch(BASE_GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            acao: 'registrar_push',
            usuario: savedU || 'Equipe',
            subscription: sub.toJSON()
          })
        });
      } catch (e) {}
    }

    async function ativarNotificacoes() {
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        await registrarAssinatura();
        window.location.replace(targetUrl);
      } else {
        alert('⚠️ Permissão bloqueada. Libere as notificações nos Ajustes do celular.');
        window.location.replace(targetUrl);
      }
    }

    async function iniciar() {
      if ('serviceWorker' in navigator && 'PushManager' in window) {
        await navigator.serviceWorker.register('./sw.js');
        if (Notification.permission === 'default') {
          document.getElementById('statusText').innerText = 'ATIVE AS NOTIFICAÇÕES PARA CONTINUAR';
          document.getElementById('btnNotify').style.display = 'inline-block';
          return;
        } else if (Notification.permission === 'granted') {
          await registrarAssinatura();
        }
      }
      window.location.replace(targetUrl);
    }

    iniciar();
  </script>
</body>
</html>
