<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Espaço 101</title>
  
  <!-- URL absoluta para impedir falhas de leitura do Safari -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://joaotoso70-ux.github.io/espaco101/logo.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://joaotoso70-ux.github.io/espaco101/logo.png">
  <link rel="shortcut icon" href="https://joaotoso70-ux.github.io/espaco101/logo.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Espaço 101">

  <style>
    /* Trava o fundo no iOS impedindo que a página seja puxada para baixo */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f5f2;
      position: fixed;
      inset: 0;
    }
    /* O deslocamento de -50px elimina por completo a barra de aviso do Google */
    iframe {
      border: 0;
      position: absolute;
      top: -50px;
      left: 0;
      width: 100%;
      height: calc(100% + 50px);
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycby2LVsIAlXthCBCUUXSfU-7KAx8p_PLwUJkTfOZz5ad5xohc8lhdFU0ZpAiR7Qs-lz6/exec" 
    allow="fullscreen">
  </iframe>
</body>
</html>
